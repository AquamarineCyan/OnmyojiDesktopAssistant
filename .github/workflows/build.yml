name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        # 跳过 network 用例：它们真实请求 GitHub API 与 5 个第三方镜像站，
        # 任一站点抖动就会让 CI/发版失败
        run: uv run pytest tests -s -m "not network"

      # 仓库现存约 150 条历史 ruff 违规，先非阻塞地跑起来暴露债务，
      # 清理完再改成硬门禁（continue-on-error 删除即可）
      - name: Run Ruff
        continue-on-error: true
        run: uv run ruff check .

      # 仅在推送到 main 或手动触发时打包，普通 PR 只跑测试
      - name: Build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: uv run pyinstaller main.spec --clean --noconfirm --distpath .

      - name: Package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
            mkdir output\resource
            xcopy src\resource output\resource /s /e /v /q /y
            mkdir output\resource_ja
            xcopy src\resource_ja output\resource_ja /s /e /v /q /y
            Compress-Archive -Path output\* -DestinationPath "OnmyojiDesktopAssistant-debug.zip"

      - name: Upload build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: OnmyojiDesktopAssistant-${{ github.sha }}
          path: OnmyojiDesktopAssistant-debug.zip
          retention-days: 7

[project]
name = "OnmyojiDesktopAssistant"
version = "2.1.7"
description = "适配网易阴阳师桌面版的辅助程序"
authors = [{name = "AquamarineCyan", email = "1057424730@qq.com"}]
readme = "README.md"
repository = "https://github.com/AquamarineCyan/OnmyojiDesktopAssistant"
packages = [{include = "src"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0.0,<2.4.0",
    "onnxruntime==1.30.0",
    # 统一使用 headless 版：rapidocr 依赖它，且它与 opencv-python 共用同一个 cv2 目录，
    # 同时安装两者会互相覆盖，安装顺序决定最终内容（不可预期）
    "opencv-python-headless==4.13.0.92",
    "packaging>=22.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.4",
    "pynput>=1.8.2",
    "pyside6==6.10.1",
    "pyside6-fluent-widgets>=1.11.2",
    "pywin32==312",
    "pyyaml==6.0.2",
    "rapidocr==3.10.0",
    "win11toast==0.35",
    "winshell==0.6",
]

[dependency-groups]
dev = [
    "py-spy>=0.4.2",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001", # 捕获 Exception 兜底
    "S110",   # try-except-pass
    "S112",   # try-except-continue
]
# 注意：这里刻意不写 select。仓库现存约 150 条历史违规（error 79%分散在各模块、
# 多为 import 排序/类型注解风格），一旦启用更宽的规则集并配成 CI 硬门禁，
# 会让每一次推送都失败。要收口需先分批清理，见 CHANGELOG「最近更新」。

[tool.pytest.ini_options]
markers = [
    "network: 需要真实访问外网（GitHub API / 第三方镜像站），CI 默认跳过",
]
